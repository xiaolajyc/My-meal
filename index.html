/* ===== Mobile/legacy Android stability ===== */
.recipe-item,.recipe-item *{writing-mode:horizontal-tb!important;text-orientation:mixed!important;direction:ltr}
.recipe-item{display:block;width:100%;min-width:0;overflow:hidden}
.recipe-name,.recipe-meta{display:block;width:100%;min-width:0;white-space:normal;word-break:normal;overflow-wrap:break-word;line-height:1.45}

.drive-sync-card{background:#fff;border:1px solid #e3e7ed;border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.035)}
.drive-sync-title{font-size:18px;font-weight:800;margin-bottom:8px}.drive-sync-last{font-size:14px;color:#6f7d92;margin-bottom:14px}
.drive-sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drive-sync-grid button{min-height:46px;font-weight:700}
.drive-sync-grid .primary{background:#147af3;color:#fff}.drive-sync-grid .secondary{background:#eef1f5;color:#45536a}
.drive-sync-check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}.drive-sync-check input{width:22px;height:22px;accent-color:#147af3}
.drive-sync-detail{font-size:13px;color:#8a98ad;line-height:1.55;margin-top:10px}.drive-status{font-size:13px;color:#6f7d92;margin-bottom:8px}.drive-connected{color:#2f6f43}.drive-error{color:#c0392b}

.side-actions{grid-template-columns:1fr 1fr 1fr!important}
@media(max-width:420px){.side-actions{grid-template-columns:1fr 1fr!important}.settings-row{padding:12px 2px}}

/* ===== Visual refresh ===== */
:root{--bg:#f7f7f5;--card:#fff;--text:#242424;--muted:#7b7b76;--line:#e8e6e1;--accent:#3f5f45;--accent-soft:#e9f0ea;--warm:#f4eee4}
body{background:linear-gradient(135deg,#f7f7f5 0%,#f2f4ef 100%);color:var(--text)}
.sidebar{background:rgba(255,255,255,.92);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(30,40,30,.04)}
.brand{padding:24px 20px 10px;font-size:24px;letter-spacing:-.5px}
.brand:after{content:'Recipe Library';display:block;font-size:11px;font-weight:500;letter-spacing:1.5px;color:var(--muted);margin-top:3px;text-transform:uppercase}
.search{background:#f5f5f2;border:1px solid transparent;border-radius:13px;padding:12px 14px;margin-top:10px;transition:.2s}
.search:focus{background:#fff;border-color:#b9c6ba;box-shadow:0 0 0 3px rgba(63,95,69,.08)}
.filters{padding-bottom:14px}.chip{background:#f0f1ed;color:#555;border:1px solid transparent;transition:.18s}.chip:hover{background:#e7ebe6}.chip.active{background:var(--accent);box-shadow:0 3px 10px rgba(63,95,69,.18)}
.recipe-list{padding:2px 10px 16px}.recipe-item{padding:13px 14px;border-radius:12px;margin:3px 0;transition:.18s;border:1px solid transparent}.recipe-item:hover{background:#f5f6f3;transform:none}.recipe-item.active{background:var(--accent-soft);border-color:#d6e2d7}.recipe-name{font-size:15px}.recipe-meta{color:var(--muted)}
.side-actions{padding:14px;border-top:1px solid var(--line);background:rgba(255,255,255,.8)}
.primary{background:var(--accent);border-radius:11px;box-shadow:0 3px 10px rgba(63,95,69,.15);transition:.18s}.primary:hover{filter:brightness(.95);transform:translateY(-1px)}.secondary{background:#eef0ec;border-radius:11px;transition:.18s}.secondary:hover{background:#e4e8e3}
.content{background:transparent}.topbar{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 30px}.topbar-actions button{border:1px solid var(--line)}
.page{max-width:1080px;padding:34px 32px 70px}.title{font-size:36px;letter-spacing:-1px}.badges{margin-top:12px}.badge{background:var(--accent-soft);color:#4d6352;border:1px solid #dce6dd}
.section{margin-top:32px}.section h2{font-size:20px;letter-spacing:-.2px}
.ingredient-table{border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 22px rgba(30,40,30,.035)}.ingredient-table th{background:#f8f8f5;color:#74746e}.ingredient-table th,.ingredient-table td{padding:13px 14px}.ingredient-row:hover td{background:#fafbf9}.amount{color:var(--accent)}
.step{border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 16px rgba(30,40,30,.025);padding:14px 16px}.num{background:var(--accent)}
.notes{background:#fbf6e9;border-color:#eadfc6;border-radius:13px}
.scale-bar{border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(30,40,30,.025);padding:14px}.scale-pill{background:#f0f1ed;border:1px solid transparent}.scale-pill.active{background:var(--accent)}
.modal-back{background:rgba(25,30,25,.42);backdrop-filter:blur(3px)}.modal{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:26px}.modal input,.modal select,.modal textarea,.form-row input,.form-row select,.form-row textarea{background:#fafaf8;border-color:#deded8}.modal input:focus,.modal select:focus,.modal textarea:focus{background:#fff;border-color:#aebcaf;box-shadow:0 0 0 3px rgba(63,95,69,.07)}
.history-item{border-color:var(--line);box-shadow:0 4px 15px rgba(30,40,30,.025);border-radius:14px}.toast{background:#26372b;border-radius:11px;box-shadow:0 8px 25px rgba(0,0,0,.16)}

/* ===== Xiaomi 6 / Android orientation stability =====
   The CSS orientation media feature is intentionally NOT used here. On old
   Android WebView, opening the IME can change the visual viewport and make a
   portrait viewport satisfy (orientation: landscape). The force-* class is
   the only source of layout direction. */
html,body{width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.recipe-item,.recipe-item *{writing-mode:horizontal-tb!important;text-orientation:mixed!important;direction:ltr}
.recipe-name,.recipe-meta{writing-mode:horizontal-tb!important;text-orientation:mixed!important;word-break:keep-all!important;overflow-wrap:normal!important}

/* Portrait phone/tablet */
html.force-portrait,html.force-portrait body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
html.force-portrait .app{display:flex!important;flex-direction:column!important;width:100%!important;height:auto!important;min-height:100%!important;max-width:100%!important;overflow-x:hidden!important;overflow-y:visible!important}
html.force-portrait .sidebar{width:100%!important;max-width:100%!important;min-width:0!important;height:68vh!important;min-height:0!important;max-height:none!important;flex:none!important;border-right:0!important;border-bottom:1px solid var(--line)!important;overflow:hidden!important}
html.force-portrait .content{width:100%!important;max-width:100%!important;min-width:0!important;min-height:32vh!important;height:auto!important;flex:none!important;overflow:visible!important}
html.force-portrait .brand{padding:18px 16px 8px!important}
html.force-portrait .search{display:block!important;box-sizing:border-box!important;width:calc(100% - 24px)!important;min-width:0!important;height:44px!important;margin:7px 12px 10px!important;padding:10px 13px!important;font-size:16px!important;line-height:22px!important;transform:none!important;zoom:1!important;-webkit-appearance:none!important;appearance:none!important}
html.force-portrait .filters{min-width:0!important;max-width:100%!important;width:100%!important;overflow-x:auto!important;overflow-y:hidden!important}
html.force-portrait .recipe-list{width:100%!important;min-width:0!important;max-width:100%!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
html.force-portrait .recipe-item{width:100%!important;max-width:100%!important;transform:none!important}
html.force-portrait .recipe-name,html.force-portrait .recipe-meta{white-space:nowrap!important}
html.force-portrait .side-actions{width:100%!important;box-sizing:border-box!important}

/* Landscape phone/tablet */
html.force-landscape,html.force-landscape body{width:100%!important;max-width:100%!important;height:100%!important;overflow:hidden!important}
html.force-landscape .app{display:flex!important;flex-direction:row!important;width:100vw!important;height:100vh!important;min-height:0!important;max-width:none!important;overflow:hidden!important}
html.force-landscape .sidebar{width:46vw!important;min-width:250px!important;max-width:460px!important;height:100vh!important;flex:none!important;border-right:1px solid var(--line)!important;border-bottom:0!important;overflow:hidden!important}
html.force-landscape .content{flex:1!important;width:auto!important;max-width:none!important;min-width:0!important;min-height:0!important;height:100vh!important;overflow:auto!important}
html.force-landscape .brand{padding:8px 12px 4px!important;font-size:18px!important}
html.force-landscape .search{display:block!important;box-sizing:border-box!important;width:calc(100% - 16px)!important;min-width:0!important;height:40px!important;margin:3px 8px 6px!important;padding:7px 10px!important;font-size:16px!important;line-height:22px!important}
html.force-landscape .filters{width:auto!important;max-width:none!important;overflow-x:auto!important;overflow-y:hidden!important}
html.force-landscape .recipe-list{flex:1!important;width:100%!important;min-width:0!important;min-height:0!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important}
html.force-landscape .recipe-item{width:100%!important;max-width:100%!important;min-height:42px!important;padding:8px 9px!important;transform:none!important}
html.force-landscape .recipe-name{font-size:14px!important;white-space:nowrap!important}
html.force-landscape .recipe-meta{font-size:10px!important;white-space:nowrap!important}
html.force-landscape .side-actions{padding:6px!important;gap:6px!important;flex:none!important}
html.force-landscape .side-actions button{min-height:36px!important;padding:6px 8px!important}
html.force-landscape .topbar{height:50px!important;padding:0 10px!important}
html.force-landscape .page{padding:16px 14px 30px!important}
html.force-landscape .title{font-size:24px!important}

/* Ingredients: keep each ingredient row intact rather than breaking Chinese
   characters vertically. The table can scroll horizontally if necessary. */
.ingredient-table{table-layout:auto!important;width:max-content!important;min-width:100%!important}
.ingredient-table th,.ingredient-table td{white-space:nowrap!important;word-break:keep-all!important;overflow-wrap:normal!important}
.section:has(.ingredient-table){overflow-x:auto!important;-webkit-overflow-scrolling:touch}
@media(max-width:800px){
  .search{font-size:16px!important;line-height:1.4;min-height:44px}
  .ingredient-table th,.ingredient-table td{padding:10px 11px}
  .ingredient-table td:nth-child(2){min-width:72px}
}

  // involved. This gives the correct initial portrait/landscape state.
  // After startup we never react to media-query changes caused by the IME.
  const mq=window.matchMedia && window.matchMedia('(orientation: landscape)');
  if(mq) return mq.matches?'landscape':'portrait';
  const legacy=window.orientation;
  if(typeof legacy==='number' && isFinite(legacy)) return Math.abs(legacy)%180===90?'landscape':'portrait';
  return 'portrait';
}
function readRotatedOrientation(){
  // This function is called ONLY after a real orientationchange / Screen
  // Orientation API event, never from resize or keyboard events.
  const so=window.screen && window.screen.orientation;
  if(so && typeof so.type==='string') return so.type.indexOf('landscape')===0?'landscape':'portrait';
  const legacy=window.orientation;
  if(typeof legacy==='number' && isFinite(legacy)) return Math.abs(legacy)%180===90?'landscape':'portrait';
  const mq=window.matchMedia && window.matchMedia('(orientation: landscape)');
  return mq && mq.matches?'landscape':'portrait';
}
let layoutOrientation=readInitialOrientation();
function applyLayoutOrientation(){
  const root=document.documentElement;
  root.classList.toggle('force-portrait',layoutOrientation==='portrait');
  root.classList.toggle('force-landscape',layoutOrientation==='landscape');
}
function updatePhysicalOrientation(){
  const next=readRotatedOrientation();
  if(next!==layoutOrientation){
    layoutOrientation=next;
    applyLayoutOrientation();
  }
}
applyLayoutOrientation();
// CRITICAL: do not listen to resize or media-query changes. Android's soft
// keyboard changes the visual viewport and may make CSS orientation flip.
window.addEventListener('orientationchange',()=>setTimeout(updatePhysicalOrientation,100));
if(window.screen && window.screen.orientation && window.screen.orientation.addEventListener){
  window.screen.orientation.addEventListener('change',()=>setTimeout(updatePhysicalOrientation,100));
}

function normalizeRecipe(r){r=structuredClone(r||{});r.id=r.id||uid('recipe');r.name=String(r.name||'');r.ingredients=Array.isArray(r.ingredients)?r.ingredients.map(i=>{const a=Array.isArray(i)?i:[i.name||'',i.amount||'',i.unit||'',i.note||''];return {id:(i&&i.id)||uid('ing'),name:String(a[0]??''),amount:String(a[1]??''),unit:String(a[2]??''),note:String(a[3]??'')}}):[];r.prep=Array.isArray(r.prep)?r.prep:[];r.cook=Array.isArray(r.cook)?r.cook:[];r.notes=String(r.notes||'');return r}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));const arr=Array.isArray(x)?x:structuredClone(DEFAULT_RECIPES);return arr.map(normalizeRecipe)}catch(e){return structuredClone(DEFAULT_RECIPES).map(normalizeRecipe)}}

function ingredientKey(r,i){return `${r.id}::${i.id}`}

function migrateChecklist(){const old=ingredientChecks||{};const next={};recipes.forEach(r=>r.ingredients.forEach((i,idx)=>{if(old[`${r.name}::${idx}`]!==undefined)next[ingredientKey(r,i)]=!!old[`${r.name}::${idx}`];else if(old[ingredientKey(r,i)]!==undefined)next[ingredientKey(r,i)]=!!old[ingredientKey(r,i)]}));ingredientChecks=next;localStorage.setItem('recipeIngredientChecks',JSON.stringify(next))}

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(x){let s=String(x??'').trim(); if(!s||!/^-?\d+(?:\.\d+)?$/.test(s))return null;return Number(s)}
function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)}
function scaledAmount(amount,factor){let n=num(amount);return n===null?amount:fmt(n*factor)}
function displayAmount(amount,unit,factor){const v=scaledAmount(amount,factor);if(unit==='个'&&num(amount)!==null)return v+' 个（'+fmt(num(amount)*55*factor)+'g）';return v}

function refreshSearchResults(){
 const listEl=document.querySelector('.recipe-list');

 const caretStart=searchEl?.selectionStart ?? null;
 const caretEnd=searchEl?.selectionEnd ?? null;
 const savedScroll=listEl?listEl.scrollTop:recipeListScrollTop;
 recipeListScrollTop=savedScroll;

 if(listEl){
   listEl.innerHTML=list.length?list.map(r=>`<div class="recipe-item ${selected===r.name?'active':''}" data-name="${esc(r.name)}"><div class="recipe-name">${esc(r.name)}</div><div class="recipe-meta">${esc(r.category)} · ${esc(r.type)}</div></div>`).join(''):`<div style="padding:25px;color:#777">没有找到匹配菜谱</div>`;
   const restore=()=>{listEl.scrollTop=recipeListScrollTop;};

     try{searchEl.focus({preventScroll:true});}catch(e){searchEl.focus();}
     if(caretStart!==null){try{searchEl.setSelectionRange(caretStart,caretEnd);}catch(e){}}
   }
 }
}
function bind(){
 const searchEl=document.getElementById('search');
 if(searchEl){
   searchEl.addEventListener('focus',()=>{searchFocused=true;document.documentElement.classList.add('search-focused')});
  searchEl.addEventListener('blur',()=>{searchFocused=false;document.documentElement.classList.remove('search-focused')});
  searchEl.addEventListener('compositionstart',()=>{searchComposing=true});
   searchEl.addEventListener('compositionend',e=>{
     searchComposing=false;
     query=e.target.value;
     refreshSearchResults();
   });
   searchEl.addEventListener('input',e=>{
     query=e.target.value;
     if(!searchComposing) refreshSearchResults();
   });
   searchEl.addEventListener('keydown',e=>{
     if(e.key==='Escape'){
       e.preventDefault();
       query='';
       refreshSearchResults();
       document.getElementById('search')?.focus();
     }
   });
 }

const COOK_DB='my_recipe_cook_photos_v1';
let cookDraftPhotos=[];
function openCookDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(COOK_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function putCookPhoto(id,blob){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getCookPhoto(id){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function delCookPhoto(id){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function loadCookRecords(){try{return JSON.parse(localStorage.getItem('recipeCookRecords')||'[]')}catch{return[]}}
function saveCookRecords(a){localStorage.setItem('recipeCookRecords',JSON.stringify(a));scheduleDriveAutoSync();}
function compressCookImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1280,ratio=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*ratio));c.height=Math.max(1,Math.round(im.naturalHeight*ratio));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('compress failed')),'image/jpeg',.76)};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
function openCookRecord(){cookDraftPhotos=[];showModal(`<h2>📸 跟做记录 · ${esc(selected||'')}</h2><p class="hint">可以边做边拍照，也可以从相册选择。照片会自动压缩后保存。</p><div class="photo-source-row"><button class="primary" id="takeCookPhoto">📷 拍照</button><button class="secondary" id="pickCookPhoto">🖼️ 选择照片</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" multiple style="display:none"><input id="galleryInput" type="file" accept="image/*" multiple style="display:none"><div id="draftPhotos" class="photo-preview-grid"></div><div class="editor-section"><h3>📝 备注</h3><textarea id="cookNote" rows="4" placeholder="记录这次跟做的情况……"></textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="saveCookRecord">保存记录</button></div>`);document.getElementById('takeCookPhoto').onclick=()=>document.getElementById('cameraInput').click();document.getElementById('pickCookPhoto').onclick=()=>document.getElementById('galleryInput').click();['cameraInput','galleryInput'].forEach(id=>document.getElementById(id).onchange=e=>addCookPhotos(e.target.files));document.getElementById('saveCookRecord').onclick=saveCookRecord}
async function addCookPhotos(files){for(const f of [...files]){if(!f.type.startsWith('image/'))continue;try{const blob=await compressCookImage(f);cookDraftPhotos.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2),blob});}catch(e){toast('有照片处理失败')}}renderDraftPhotos()}
function renderDraftPhotos(){const el=document.getElementById('draftPhotos');if(!el)return;el.innerHTML=cookDraftPhotos.map((p,i)=>`<div class="photo-thumb"><img src="${URL.createObjectURL(p.blob)}"><button onclick="removeDraftPhoto(${i})">×</button></div>`).join('')}
function removeDraftPhoto(i){cookDraftPhotos.splice(i,1);renderDraftPhotos()}
async function saveCookRecord(){const note=document.getElementById('cookNote')?.value.trim()||'';if(!cookDraftPhotos.length&&!note){toast('请至少添加照片或备注');return}const rec={id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2),recipeId:recipes.find(x=>x.name===selected)?.id,recipe:selected,date:new Date().toISOString(),note,photos:cookDraftPhotos.map(p=>p.id)};try{for(const p of cookDraftPhotos)await putCookPhoto(p.id,p.blob);const a=loadCookRecords();a.unshift(rec);saveCookRecords(a);cookDraftPhotos=[];closeModal();toast('跟做记录已保存')}catch(e){toast('保存失败，请重试')}}
async function openCookHistory(){const current=recipes.find(x=>x.name===selected); const all=loadCookRecords().filter(x=>x.recipeId===current?.id || (!x.recipeId&&x.recipe===selected));if(!all.length){showModal(`<h2>📖 历史记录</h2><p class="hint">「${esc(selected||'')}」还没有跟做记录。</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">关闭</button></div>`);return}showModal(`<h2>📖 ${esc(selected)} · 历史记录</h2><div id="historyList"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">关闭</button></div>`);const el=document.getElementById('historyList');for(const r of all){const item=document.createElement('div');item.className='history-item';item.innerHTML=`<div class="history-head"><strong>${new Date(r.date).toLocaleString('zh-CN')}</strong><button class="mini danger" data-del="${esc(r.id)}">删除</button></div>${r.note?`<div style="white-space:pre-wrap;margin-top:8px">${esc(r.note)}</div>`:''}<div class="history-grid"></div>`;el.appendChild(item);const grid=item.querySelector('.history-grid');for(const pid of r.photos||[]){const blob=await getCookPhoto(pid);if(blob){const img=document.createElement('img');img.src=URL.createObjectURL(blob);grid.appendChild(img)}}item.querySelector('[data-del]').onclick=()=>deleteCookRecord(r.id)}}
async function deleteCookRecord(id){const a=loadCookRecords(),r=a.find(x=>x.id===id);if(!r)return;if(!confirm('确定删除这条跟做历史记录吗？'))return;for(const pid of r.photos||[])await delCookPhoto(pid);saveCookRecords(a.filter(x=>x.id!==id));openCookHistory()}
function ingredientWeightG(i){
 const n=num(i.amount);
 if(n===null)return null;
 const u=String(i.unit||'').trim().toLowerCase();
 if(/^(g|克|公克|gram|grams)$/.test(u))return n;
 if(/^(kg|千克|公斤|kilogram|kilograms)$/.test(u))return n*1000;
 if(u==='个' && /鸡蛋/.test(i.name))return n*55;
 return null;
}
function recipeTotalWeight(r){
 let total=0,count=0;
 for(const i of r.ingredients||[]){const w=ingredientWeightG(i);if(w!==null){total+=w;count++;}}
 return {total,count,all:(r.ingredients||[]).length};
}
function openTotalWeightModal(){
 const r=recipes.find(x=>x.name===selected);
 if(!r)return;
 const info=recipeTotalWeight(r);
 if(!(info.total>0)){toast('这个菜谱没有可计算的总重量');return}
 const excluded=info.all-info.count;
 showModal(`<h2>⚖️ 按菜谱总重调整</h2><p class="hint">当前可计算总重：<strong>${fmt(info.total)}g</strong>${excluded?`（${excluded} 项因单位为毫升、个等无法可靠换算为重量，未计入）`:''}</p><div class="scale-box"><label>目标总重量（g）</label><input id="totalTarget" type="number" min="0" step="any" placeholder="例如 2000"><div id="totalRatio" class="scale-result">—</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="applyTotal">应用调整</button></div>`);
 const update=()=>{const t=Number(document.getElementById('totalTarget').value);document.getElementById('totalRatio').textContent=t>0?`调整比例：${fmt(t/info.total)}×`:'—'};
 document.getElementById('totalTarget').oninput=update;
 document.getElementById('applyTotal').onclick=()=>{const t=Number(document.getElementById('totalTarget').value);if(!(t>0)){toast('请输入有效目标总重量');return}scale=t/info.total;closeModal();render()};
}
function openScaleModal(){
 const r=recipes.find(x=>x.name===selected); const opts=r.ingredients.map((i,idx)=>{let n=num(i.amount);return n!==null?`<option value="${idx}">${esc(i.name)}（${esc(i.amount)}${esc(i.unit)}${/鸡蛋/.test(i.name)}&&i.unit==='个'?'，约'+fmt(n*55)+'g':''}）</option>`:''}).join('');

function parseRecipeText(text){
  // 统一手机复制/粘贴产生的换行，再进行结构化识别
  text=String(text||'').replace(/\u2029|\u2028/g,'\n').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ');
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const name=lines[0]||'新菜谱';
  let category='其他/实验', type='菜谱';
  if(/配方|酱料|腌制|蘸料/.test(name)) type='配方';
  if(/实验|研究|方案/.test(name)) type='实验';
  if(/蛋糕|烘焙|蛋挞/.test(name)) category='烘焙';
  else if(/鱼|虾|蟹|海鲜|三文鱼|螺/.test(name)) category='海鲜';
  else if(/鸡|牛|猪|羊|肉|排|翅|肚|肥肠/.test(name)) category='肉类';
  else if(/饭|面|饺子|米饭|粥/.test(name)) category='主食';
  else if(/汤|火锅/.test(name)) category='汤/火锅';
  else if(/酱|蘸料|醋|蚝油/.test(name)) category='酱料';
  else if(/咖啡|饮料|莫吉托/.test(name)) category='饮料';

  const ingredients=[], prep=[], cook=[], notes=[];
  let section='auto';
  const headers={
    '配料':'ingredients','材料':'ingredients','食材':'ingredients','原料':'ingredients','用料':'ingredients',
    '备菜':'prep','准备':'prep','准备工作':'prep','备料':'prep',
    '腌料':'ingredients','腌制':'prep',
    '做法':'cook','步骤':'cook','烹饪':'cook','烹制':'cook','制作':'cook','烹调':'cook',
    '烹饪步骤':'cook','烹饪过程':'cook','制作步骤':'cook','制作过程':'cook','烹调步骤':'cook',
    '备注':'notes','说明':'notes','注意':'notes','注意事项':'notes'
  };
  const cleanHeader=s=>String(s||'').replace(/[\s：:（）()【】\[\]、.。_\-—]+/g,'');
  const getHeader=s=>{const n=cleanHeader(s); return headers[n]||null;};
  const add=(n,a,u,note='')=>{n=String(n||'').trim(); if(!n)return false; ingredients.push([n,String(a||'').trim(),String(u||'').trim(),String(note||'').trim()]); return true;};

  // 数量支持：1000g鸡肉 / 鸡肉1000g / 50-100g水 / 1.5kg牛肉
  const units='kg|mg|ml|g|l|L|个|只|份|勺|汤匙|茶匙|tbsp|tsp|%';
  const num='[0-9]+(?:\\.[0-9]+)?(?:\\s*-\\s*[0-9]+(?:\\.[0-9]+)?)?';
  const pre=new RegExp('^('+num+')\\s*('+units+')\\s*(.+?)$','i');
  const suf=new RegExp('^(.+?)\\s*('+num+')\\s*('+units+')(?:\\s*[：:]?\\s*(.*))?$','i');
  const specialSuffix=new RegExp('^(.+?)\\s*(适量|少量|一点点|两点点|若干)$');
  const specialColon=/^(.+?)[：:]\s*(适量|少量|一点点|两点点|若干)$/;

  function parseOne(line){
    line=String(line||'').trim(); if(!line)return false;
    // 同一行多个配料，例如：鸡翅310g，生抽18g，老抽6g
    const parts=line.split(/[，,；;、]+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1){let ok=0; for(const p of parts) if(parseOne(p)) ok++; return ok>0;}
    let m=line.match(pre);
    if(m){add(m[3],m[1].replace(/\s+/g,''),m[2]);return true;}
    m=line.match(suf);
    if(m){add(m[1],m[2].replace(/\s+/g,''),m[3],m[4]||'');return true;}
    m=line.match(specialColon);
    if(m){add(m[1],m[2], '');return true;}
    m=line.match(specialSuffix);
    if(m){add(m[1],m[2], '');return true;}
    return false;
  }

  // 自动模式：连续识别到配料就归入配料；第一次识别失败后，后续普通句子归入烹饪。
  let autoSawIngredient=false, autoStartedCook=false;
  for(let i=1;i<lines.length;i++){
    const raw=lines[i];
    const noTrail=raw.replace(/[：:]\s*$/,'').trim();
    const explicit=getHeader(noTrail);
    if(explicit){section=explicit;continue;}

    const colon=raw.match(/^(.+?)[：:]\s*(.+)$/);
    if(colon){
      const h=getHeader(colon[1]);
      if(h){
        section=h;
        const rest=colon[2].trim();
        if(rest){
          if(section==='ingredients')parseOne(rest);
          else if(section==='prep')prep.push(rest);
          else if(section==='cook')cook.push(rest);
          else notes.push(rest);
        }
        continue;
      }
    }

    if(section==='auto'){
      if(parseOne(raw)){autoSawIngredient=true; continue;}
      if(autoSawIngredient || autoStartedCook){autoStartedCook=true; cook.push(raw);}
      else notes.push(raw);
    }else if(section==='ingredients'){
      if(!parseOne(raw)) notes.push(raw);
    }else if(section==='prep'){
      prep.push(raw);
    }else if(section==='cook'){
      cook.push(raw);
    }else{
      notes.push(raw);
    }
  }
  return {name,category,type,ingredients,prep,cook,notes:notes.join('\n')};
}

async function blobToDataURL(blob){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
function dataURLToBlob(data){const [head,b64]=String(data).split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'image/jpeg';const bin=atob(b64||'');const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}

function driveEnsureGIS(){

    const old=document.querySelector('script[data-google-gis]');

  });
  return driveGISPromise;
}
function driveTokenValid(){return !!driveToken&&Date.now()<driveTokenExpiresAt-60000}
async function driveGetToken(interactive=true){
  if(driveTokenValid())return driveToken;
  await driveEnsureGIS();
  return await new Promise((resolve,reject)=>{
    let settled=false;
    const client=google.accounts.oauth2.initTokenClient({
      client_id:DRIVE_CLIENT_ID,scope:DRIVE_SCOPE,
      callback:(resp)=>{
        if(resp.error){settled=true;reject(new Error(resp.error_description||resp.error));return}
        driveToken=resp.access_token;driveTokenExpiresAt=Date.now()+Number(resp.expires_in||3600)*1000;settled=true;resolve(driveToken);
      },
      error_callback:(err)=>{if(!settled)reject(new Error(err?.message||'Google 登录窗口未完成'))}
    });
    client.requestAccessToken({prompt:interactive?'consent':'none'});
  });

  return {schema:'my-recipe-app-sync-v1',appVersion:APP_VERSION,updatedAt:new Date().toISOString(),recipes,ingredientChecks,records,photos,lastSelectedRecipeId:localStorage.getItem(LAST_RECIPE_KEY)||''};
}
async function driveFindFile(){
  const q=`name='${DRIVE_FILE_NAME}' and trashed=false`;
  const url='https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q,spaces:'drive',fields:'files(id,name,modifiedTime,size)',pageSize:'10'});
  const r=await driveFetch(url);const data=await r.json();
  const f=data.files?.[0]||null;if(f){driveRememberConnection(f.id)}
  return f;
}
function driveSetStatus(text,type=''){const el=document.getElementById('driveStatus');if(el){el.className='drive-status '+(type==='ok'?'drive-connected':type==='error'?'drive-error':'');el.textContent=text}}
function driveConnectionText(){
  if(localStorage.getItem(DRIVE_CONNECTED_KEY)==='1')return driveFileId?'当前账号已授权 drive.file；云端文件：已关联。':'当前账号已授权 drive.file；云端文件：尚未创建。';
  return '尚未连接 Google Drive。';
}
function driveStatusText(){return driveConnectionText()}
async function driveUpload(showToast=true,automatic=false){
  if(driveBusy)return;driveBusy=true;
  driveSetStatus(automatic?'正在自动同步…':'正在整理数据并上传…');
  try{
    await driveGetToken(!automatic);
    const existing=await driveFindFile();
    const text=JSON.stringify(await recipeDrivePayload());
    if(existing){
      driveFileId=existing.id;localStorage.setItem(DRIVE_FILE_ID_KEY,driveFileId);
      await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(driveFileId)+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:text});
    }else{
      const boundary='recipeAppBoundary'+Date.now();
      const meta=JSON.stringify({name:DRIVE_FILE_NAME,mimeType:'application/json'});
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+text+'\r\n--'+boundary+'--';
      const r=await driveFetch('https://www.googleapis.com/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
      const data=await r.json();driveRememberConnection(data.id);
    }
    driveRememberConnection(driveFileId);driveRememberSync();
    driveSetStatus('同步完成 · '+new Date().toLocaleString(),'ok');
    if(showToast)toast('已同步到 Google Drive');
  }catch(e){
    if(automatic){driveSetStatus('自动同步暂未完成：请重新连接 Google Drive','error')}else{driveSetStatus('同步失败：'+(e.message||e),'error');if(showToast)toast('Google Drive 上传失败：'+(e.message||e))}
  }finally{driveBusy=false}
}
async function driveDownload(){
  if(driveBusy)return;driveBusy=true;driveSetStatus('正在从 Google Drive 下载…');
  try{
    const f=await driveFindFile();
    if(!f){driveSetStatus('云端还没有同步文件','error');toast('Google Drive 中还没有食谱同步文件，请先上传');return}
    driveFileId=f.id;driveRememberConnection(f.id);
    const r=await driveFetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(driveFileId)+'?alt=media');
    const data=await r.json();
    if(data.schema!=='my-recipe-app-sync-v1'||!Array.isArray(data.recipes))throw new Error('云端文件格式不正确');
    if(!confirm(`将用 Google Drive 中的 ${data.recipes.length} 个菜谱、跟做记录和照片覆盖本机数据吗？`)){driveSetStatus(driveConnectionText(),'ok');return}
    window.__driveApplying=true;
    recipes=data.recipes.map(normalizeRecipe);ingredientChecks=data.ingredientChecks&&typeof data.ingredientChecks==='object'?data.ingredientChecks:{};
    saveCookRecords(Array.isArray(data.records)?data.records:[]);
    for(const [pid,raw] of Object.entries(data.photos||{})){try{await putCookPhoto(pid,dataURLToBlob(raw))}catch{}}
    migrateChecklist();migrateCookRecords();localStorage.setItem(KEY,JSON.stringify(recipes));
    const wantedId=String(data.lastSelectedRecipeId||'');const wanted=recipes.find(r=>r.id===wantedId)||recipes[0];selected=wanted?.name||null;
    if(wanted?.id)localStorage.setItem(LAST_RECIPE_KEY,wanted.id);else localStorage.removeItem(LAST_RECIPE_KEY);
    category='全部';query='';scale=1;render();window.__driveApplying=false;driveRememberSync();driveSetStatus('同步完成 · '+new Date().toLocaleString(),'ok');toast('云端数据已恢复到本机');
  }catch(e){window.__driveApplying=false;driveSetStatus('同步失败：'+(e.message||e),'error');toast('Google Drive 下载失败：'+(e.message||e))}
  finally{driveBusy=false}
}
async function driveConnect(){
  try{driveSetStatus('正在连接 Google Drive…');await driveGetToken(true);const f=await driveFindFile();driveRememberConnection(f?.id||driveFileId);driveSetStatus(f?'当前账号已授权 drive.file；云端文件：已关联。':'当前账号已授权 drive.file；云端文件：尚未创建。','ok');settingsModal()}
  catch(e){driveSetStatus('连接失败：'+(e.message||e),'error');toast('Google Drive 连接失败：'+(e.message||e))}
}
function driveDisconnect(){driveToken=null;driveTokenExpiresAt=0;driveForgetConnection();driveSetStatus('尚未连接 Google Drive');settingsModal()}
function scheduleDriveAutoSync(delay=1200){
  if(!window.__recipeAppReady||localStorage.getItem(DRIVE_AUTO_SYNC_KEY)==='0'||localStorage.getItem(DRIVE_CONNECTED_KEY)!=='1'||window.__driveApplying)return;
  clearTimeout(driveAutoSyncTimer);driveAutoSyncTimer=setTimeout(()=>{if(!driveBusy&&!window.__driveApplying)driveUpload(false,true)},delay);
}

function settingsModal(){
 const autoSync=driveAutoSyncEnabled();
 showModal(`<h2>⚙ 设置</h2>
 <div class="settings-card">
  <div class="settings-row"><span>应用名称</span><strong>我的食谱</strong></div>
  <div class="settings-row"><span>版本</span><strong>${APP_VERSION}</strong></div>
  <div class="settings-row"><span>应用类型</span><strong>PWA · 离线应用</strong></div>
 </div>
 <div class="drive-sync-card" style="margin-top:12px">
  <div class="drive-sync-title">Google Drive 云同步</div>
  <div class="drive-sync-last" id="driveLastSync">${esc(driveLastSyncText())}</div>
  <div id="driveStatus" class="drive-status ${localStorage.getItem(DRIVE_CONNECTED_KEY)==='1'?'drive-connected':''}">${esc(driveConnectionText())}</div>
  <div class="drive-sync-grid">
   <button class="primary" onclick="driveConnect()">连接 Google Drive</button>
   <button class="secondary" onclick="driveDisconnect()">断开</button>
   <button class="primary" onclick="driveUpload()">☁️ 上传/同步</button>
   <button class="secondary" onclick="driveDownload()">⬇️ 从云端恢复</button>
  </div>
  <label class="drive-sync-check"><input id="driveAutoSync" type="checkbox" ${autoSync?'checked':''} onchange="setDriveAutoSync(this.checked)"><span>数据修改后自动同步</span></label>
  <div class="drive-sync-detail">当前账号授权范围：drive.file；云端文件：${driveFileId?'已关联':'未关联'}。自动同步为本机开关。</div>
 </div>
 <p class="hint">版本信息用于确认当前安装的应用版本。更新 PWA 后，如果仍显示旧版本，请重新加载或重新安装主屏幕应用。</p>
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">关闭</button></div>`);
}

function backupModal(){
 const isFilePage=location.protocol==='file:'; const canSaveAs=typeof window.showSaveFilePicker==='function'&&window.isSecureContext;
 showModal(`<h2>💾 数据备份</h2><p>当前共有 <strong>${recipes.length}</strong> 个菜谱。</p><div style="background:#f5f6f8;border-radius:9px;padding:12px 13px;margin:12px 0;line-height:1.6;font-size:13px"><strong>完整备份包含：</strong>菜谱、配料Checklist、跟做历史、照片。照片会转成压缩后的数据写入备份，因此文件可能比较大。</div><div class="modal-actions" style="flex-wrap:wrap"><button class="primary" id="export">⬇️ 导出完整备份</button><button class="secondary" id="copyBackup">📋 复制完整备份</button><button class="secondary" id="importBtn">📥 导入备份</button><button class="secondary" onclick="closeModal()">关闭</button></div><div class="hint" style="margin-top:12px">${isFilePage?'直接双击 HTML 时不能使用系统“另存为”，请使用“导出完整备份”。':(canSaveAs?'当前环境支持系统保存。':'当前环境不支持系统保存。')}</div><input type="file" id="fileInput" accept=".json,application/json" style="display:none"><textarea id="backupText" style="position:fixed;left:-99999px;top:-99999px;width:1px;height:1px"></textarea>`);
 const exportBtn=document.getElementById('export'); exportBtn.onclick=async()=>{exportBtn.disabled=true;exportBtn.textContent='⏳ 正在整理照片…';try{const data=await makeFullBackup();const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='我的食谱完整备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('完整备份已导出')}catch(e){toast('备份失败')}finally{exportBtn.disabled=false;exportBtn.textContent='⬇️ 导出完整备份'}};
 document.getElementById('copyBackup').onclick=async()=>{try{const data=await makeFullBackup();await navigator.clipboard.writeText(JSON.stringify(data));toast('完整备份已复制')}catch(e){toast('复制失败，请改用导出文件')}};
 document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
 document.getElementById('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());const incoming=Array.isArray(x)?{version:1,recipes:x,ingredientChecks:{},records:[],photos:{}}:x;if(!Array.isArray(incoming.recipes))throw new Error('invalid');if(!confirm(`准备导入 ${incoming.recipes.length} 个菜谱${Array.isArray(incoming.records)?`和 ${incoming.records.length} 条跟做记录`:''}，会替换当前数据，是否继续？`))return;recipes=incoming.recipes.map(normalizeRecipe);ingredientChecks=incoming.ingredientChecks||{};saveCookRecords(Array.isArray(incoming.records)?incoming.records:[]);for(const [pid,data] of Object.entries(incoming.photos||{})){try{await putCookPhoto(pid,dataURLToBlob(data))}catch{}}migrateChecklist();migrateCookRecords();save();selected=recipes[0]?.name||null;category='全部';query='';scale=1;persistSelected();save();closeModal();render();toast('完整备份导入成功')}catch(e){toast('备份文件格式不正确，未导入')}};
}
function showModal(content){let d=document.createElement('div');d.className='modal-back';d.id='modal';d.innerHTML='<div class="modal">'+content+'</div>';document.body.appendChild(d)}
function closeModal(){document.getElementById('modal')?.remove()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
migrateChecklist();
migrateCookRecords();
persistSelected();
save();
render();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
