/* ===== Visual refresh ===== */
:root{--bg:#f7f7f5;--card:#fff;--text:#242424;--muted:#7b7b76;--line:#e8e6e1;--accent:#3f5f45;--accent-soft:#e9f0ea;--warm:#f4eee4}
body{background:linear-gradient(135deg,#f7f7f5 0%,#f2f4ef 100%);color:var(--text)}
.sidebar{background:rgba(255,255,255,.92);border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(30,40,30,.04)}
.brand{padding:24px 20px 10px;font-size:24px;letter-spacing:-.5px}
.brand:after{content:'Recipe Library';display:block;font-size:11px;font-weight:500;letter-spacing:1.5px;color:var(--muted);margin-top:3px;text-transform:uppercase}
.search{background:#f5f5f2;border:1px solid transparent;border-radius:13px;padding:12px 14px;margin-top:10px;transition:.2s}
.search:focus{background:#fff;border-color:#b9c6ba;box-shadow:0 0 0 3px rgba(63,95,69,.08)}
.filters{padding-bottom:14px}.chip{background:#f0f1ed;color:#555;border:1px solid transparent;transition:.18s}.chip:hover{background:#e7ebe6}.chip.active{background:var(--accent);box-shadow:0 3px 10px rgba(63,95,69,.18)}
.recipe-list{padding:2px 10px 16px}.recipe-item{padding:13px 14px;border-radius:12px;margin:3px 0;transition:.18s;border:1px solid transparent}.recipe-item:hover{background:#f5f6f3;transform:translateX(2px)}.recipe-item.active{background:var(--accent-soft);border-color:#d6e2d7}.recipe-name{font-size:15px}.recipe-meta{color:var(--muted)}
.side-actions{padding:14px;border-top:1px solid var(--line);background:rgba(255,255,255,.8)}
.primary{background:var(--accent);border-radius:11px;box-shadow:0 3px 10px rgba(63,95,69,.15);transition:.18s}.primary:hover{filter:brightness(.95);transform:translateY(-1px)}.secondary{background:#eef0ec;border-radius:11px;transition:.18s}.secondary:hover{background:#e4e8e3}
.content{background:transparent}.topbar{height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 30px}.topbar-actions button{border:1px solid var(--line)}
.page{max-width:1080px;padding:34px 32px 70px}.title{font-size:36px;letter-spacing:-1px}.badges{margin-top:12px}.badge{background:var(--accent-soft);color:#4d6352;border:1px solid #dce6dd}
.section{margin-top:32px}.section h2{font-size:20px;letter-spacing:-.2px}
.ingredient-table{border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 22px rgba(30,40,30,.035)}.ingredient-table th{background:#f8f8f5;color:#74746e}.ingredient-table th,.ingredient-table td{padding:13px 14px}.ingredient-row:hover td{background:#fafbf9}.amount{color:var(--accent)}
.step{border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 16px rgba(30,40,30,.025);padding:14px 16px}.num{background:var(--accent)}
.notes{background:#fbf6e9;border-color:#eadfc6;border-radius:13px}
.scale-bar{border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(30,40,30,.025);padding:14px}.scale-pill{background:#f0f1ed;border:1px solid transparent}.scale-pill.active{background:var(--accent)}
.modal-back{background:rgba(25,30,25,.42);backdrop-filter:blur(3px)}.modal{border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:26px}.modal input,.modal select,.modal textarea,.form-row input,.form-row select,.form-row textarea{background:#fafaf8;border-color:#deded8}.modal input:focus,.modal select:focus,.modal textarea:focus{background:#fff;border-color:#aebcaf;box-shadow:0 0 0 3px rgba(63,95,69,.07)}
.history-item{border-color:var(--line);box-shadow:0 4px 15px rgba(30,40,30,.025);border-radius:14px}.toast{background:#26372b;border-radius:11px;box-shadow:0 8px 25px rgba(0,0,0,.16)}
@media(max-width:800px){body{background:#f7f7f5}.brand{padding-top:18px}.topbar{height:58px;padding:0 14px}.page{padding:24px 14px 50px}.title{font-size:29px}.recipe-item:hover{transform:none}.side-actions{padding:10px}.modal{border-radius:17px;padding:18px}}

function normalizeRecipe(r){r=structuredClone(r||{});r.id=r.id||uid('recipe');r.name=String(r.name||'');r.ingredients=Array.isArray(r.ingredients)?r.ingredients.map(i=>{const a=Array.isArray(i)?i:[i.name||'',i.amount||'',i.unit||'',i.note||''];return {id:(i&&i.id)||uid('ing'),name:String(a[0]??''),amount:String(a[1]??''),unit:String(a[2]??''),note:String(a[3]??'')}}):[];r.prep=Array.isArray(r.prep)?r.prep:[];r.cook=Array.isArray(r.cook)?r.cook:[];r.notes=String(r.notes||'');return r}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));const arr=Array.isArray(x)?x:structuredClone(DEFAULT_RECIPES);return arr.map(normalizeRecipe)}catch(e){return structuredClone(DEFAULT_RECIPES).map(normalizeRecipe)}}
function save(){localStorage.setItem(KEY,JSON.stringify(recipes));}
function ingredientKey(r,i){return `${r.id}::${i.id}`}
function migrateCookRecords(){const a=loadCookRecords();let changed=false;for(const r of a){if(!r.recipeId&&r.recipe){const hit=recipes.find(x=>x.name===r.recipe);if(hit){r.recipeId=hit.id;changed=true}}}if(changed)saveCookRecords(a)}
function migrateChecklist(){const old=ingredientChecks||{};const next={};recipes.forEach(r=>r.ingredients.forEach((i,idx)=>{if(old[`${r.name}::${idx}`]!==undefined)next[ingredientKey(r,i)]=!!old[`${r.name}::${idx}`];else if(old[ingredientKey(r,i)]!==undefined)next[ingredientKey(r,i)]=!!old[ingredientKey(r,i)]}));ingredientChecks=next;localStorage.setItem('recipeIngredientChecks',JSON.stringify(next))}

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(x){let s=String(x??'').trim(); if(!s||!/^-?\d+(?:\.\d+)?$/.test(s))return null;return Number(s)}
function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100)}
function scaledAmount(amount,factor){let n=num(amount);return n===null?amount:fmt(n*factor)}
function displayAmount(amount,unit,factor){const v=scaledAmount(amount,factor);if(unit==='个'&&num(amount)!==null)return v+' 个（'+fmt(num(amount)*55*factor)+'g）';return v}
function filtered(){let q=query.trim().toLowerCase();return recipes.filter(r=>(category==='全部'||r.category===category)&&(!q||r.name.toLowerCase().includes(q)||r.ingredients.some(i=>i.name.toLowerCase().includes(q))))}
function render(){
 const cats=['全部',...new Set(recipes.map(r=>r.category))];
 const list=filtered();
 document.getElementById('app').innerHTML=`<div class="app">
 <aside class="sidebar">
  <div class="brand">🍳 我的食谱</div>
  <input class="search" id="search" placeholder="搜索菜名 / 食材" value="${esc(query)}">
  <div class="filters">${cats.map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="recipe-list">${list.length?list.map(r=>`<div class="recipe-item ${selected===r.name?'active':''}" data-name="${esc(r.name)}"><div class="recipe-name">${esc(r.name)}</div><div class="recipe-meta">${esc(r.category)} · ${esc(r.type)}</div></div>`).join(''):`<div style="padding:25px;color:#777">没有找到匹配菜谱</div>`}</div>
  <div class="side-actions"><button class="primary" id="new">＋ 新增菜谱</button><button class="secondary" id="backup" title="导出或导入 JSON 备份">⇅ 数据备份</button></div>
 </aside>
 <main class="content">
  <div class="topbar"><strong>食谱库 · ${recipes.length} 个配方</strong><div class="topbar-actions">${selected?`<button class="secondary" id="edit">编辑</button><button class="secondary" id="del">删除</button>`:''}</div></div>
  ${renderDetail()}
 </main></div>`;
 bind();
 bindIngredientChecklist();
}
function renderDetail(){
 const r=recipes.find(x=>x.name===selected); if(!r)return '<div class="empty">选择一个菜谱开始</div>';
 const scaled=scale!==1;
 return `<div class="page"><div class="title-row"><div><h1 class="title">${esc(r.name)}</h1><div class="badges"><span class="badge">${esc(r.category)}</span><span class="badge">${esc(r.type)}</span>${scaled?`<span class="badge">当前 ${fmt(scale)}×</span>`:''}</div></div></div>
 <div class="scale-bar"><strong>配方调整：</strong>${[0.5,1,1.5,2,3].map(v=>`<button class="scale-pill ${scale===v?'active':''}" data-scale="${v}">${v}×</button>`).join('')}<button class="scale-pill" id="customScale">自定义</button><button class="scale-pill" id="baseScale">按主材料</button><button class="scale-pill" id="totalScale">按总重</button>${scaled?'<button class="scale-pill" id="resetScale">恢复原配方</button>':''}</div><div class="cook-actions"><button class="primary" id="cookRecord">📸 跟做记录</button><button class="secondary" id="cookHistory">📖 历史记录</button></div>
 <div class="section"><h2>🧂 配料 ${scaled?`<span class="hint">（原始配方 × ${fmt(scale)}）</span>`:''}<span class="check-progress" id="ingredientProgress"></span><button class="mini" id="resetIngChecks" style="float:right">全部取消</button></h2><table class="ingredient-table checklist-table"><thead><tr><th class="check-col">✓</th><th>食材</th><th>数量</th><th>单位</th><th>备注</th></tr></thead><tbody>${r.ingredients.map((i,idx)=>{const key=ingredientKey(r,i);const checked=!!ingredientChecks[key];return `<tr class="ingredient-row ${checked?'checked':''}"><td class="check-col"><input type="checkbox" class="ingredient-check" data-ing-key="${esc(key)}" ${checked?'checked':''}></td><td>${esc(i.name)}</td><td class="amount">${esc(displayAmount(i.amount,i.unit,scale))}</td><td>${/鸡蛋/.test(i.name)&&i.unit==='个'?'个（≈55g/个）':esc(i.unit)}</td><td>${esc(i.note)}</td></tr>`}).join('')}</tbody></table></div>
 ${renderSteps('🔪 备菜',r.prep)}${renderSteps('🍳 烹饪',r.cook)}${r.notes?`<div class="section"><h2>📝 备注</h2><div class="notes">${esc(r.notes)}</div></div>`:''}
 </div>`;
}
function renderSteps(title,arr){if(!arr?.length)return '';return `<div class="section"><h2>${title}</h2>${arr.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div>${esc(s)}</div></div>`).join('')}</div>`}

const COOK_DB='my_recipe_cook_photos_v1';
let cookDraftPhotos=[];
function openCookDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(COOK_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function putCookPhoto(id,blob){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function getCookPhoto(id){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function delCookPhoto(id){const db=await openCookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function loadCookRecords(){try{return JSON.parse(localStorage.getItem('recipeCookRecords')||'[]')}catch{return[]}}
function saveCookRecords(a){localStorage.setItem('recipeCookRecords',JSON.stringify(a))}
function compressCookImage(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1280,ratio=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*ratio));c.height=Math.max(1,Math.round(im.naturalHeight*ratio));c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error('compress failed')),'image/jpeg',.76)};im.onerror=reject;im.src=fr.result};fr.onerror=reject;fr.readAsDataURL(file)})}
function openCookRecord(){cookDraftPhotos=[];showModal(`<h2>📸 跟做记录 · ${esc(selected||'')}</h2><p class="hint">可以边做边拍照，也可以从相册选择。照片会自动压缩后保存。</p><div class="photo-source-row"><button class="primary" id="takeCookPhoto">📷 拍照</button><button class="secondary" id="pickCookPhoto">🖼️ 选择照片</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" multiple style="display:none"><input id="galleryInput" type="file" accept="image/*" multiple style="display:none"><div id="draftPhotos" class="photo-preview-grid"></div><div class="editor-section"><h3>📝 备注</h3><textarea id="cookNote" rows="4" placeholder="记录这次跟做的情况……"></textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="saveCookRecord">保存记录</button></div>`);document.getElementById('takeCookPhoto').onclick=()=>document.getElementById('cameraInput').click();document.getElementById('pickCookPhoto').onclick=()=>document.getElementById('galleryInput').click();['cameraInput','galleryInput'].forEach(id=>document.getElementById(id).onchange=e=>addCookPhotos(e.target.files));document.getElementById('saveCookRecord').onclick=saveCookRecord}
async function addCookPhotos(files){for(const f of [...files]){if(!f.type.startsWith('image/'))continue;try{const blob=await compressCookImage(f);cookDraftPhotos.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2),blob});}catch(e){toast('有照片处理失败')}}renderDraftPhotos()}
function renderDraftPhotos(){const el=document.getElementById('draftPhotos');if(!el)return;el.innerHTML=cookDraftPhotos.map((p,i)=>`<div class="photo-thumb"><img src="${URL.createObjectURL(p.blob)}"><button onclick="removeDraftPhoto(${i})">×</button></div>`).join('')}
function removeDraftPhoto(i){cookDraftPhotos.splice(i,1);renderDraftPhotos()}
async function saveCookRecord(){const note=document.getElementById('cookNote')?.value.trim()||'';if(!cookDraftPhotos.length&&!note){toast('请至少添加照片或备注');return}const rec={id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2),recipeId:recipes.find(x=>x.name===selected)?.id,recipe:selected,date:new Date().toISOString(),note,photos:cookDraftPhotos.map(p=>p.id)};try{for(const p of cookDraftPhotos)await putCookPhoto(p.id,p.blob);const a=loadCookRecords();a.unshift(rec);saveCookRecords(a);cookDraftPhotos=[];closeModal();toast('跟做记录已保存')}catch(e){toast('保存失败，请重试')}}
async function openCookHistory(){const current=recipes.find(x=>x.name===selected); const all=loadCookRecords().filter(x=>x.recipeId===current?.id || (!x.recipeId&&x.recipe===selected));if(!all.length){showModal(`<h2>📖 历史记录</h2><p class="hint">「${esc(selected||'')}」还没有跟做记录。</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">关闭</button></div>`);return}showModal(`<h2>📖 ${esc(selected)} · 历史记录</h2><div id="historyList"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">关闭</button></div>`);const el=document.getElementById('historyList');for(const r of all){const item=document.createElement('div');item.className='history-item';item.innerHTML=`<div class="history-head"><strong>${new Date(r.date).toLocaleString('zh-CN')}</strong><button class="mini danger" data-del="${esc(r.id)}">删除</button></div>${r.note?`<div style="white-space:pre-wrap;margin-top:8px">${esc(r.note)}</div>`:''}<div class="history-grid"></div>`;el.appendChild(item);const grid=item.querySelector('.history-grid');for(const pid of r.photos||[]){const blob=await getCookPhoto(pid);if(blob){const img=document.createElement('img');img.src=URL.createObjectURL(blob);grid.appendChild(img)}}item.querySelector('[data-del]').onclick=()=>deleteCookRecord(r.id)}}
async function deleteCookRecord(id){const a=loadCookRecords(),r=a.find(x=>x.id===id);if(!r)return;if(!confirm('确定删除这条跟做历史记录吗？'))return;for(const pid of r.photos||[])await delCookPhoto(pid);saveCookRecords(a.filter(x=>x.id!==id));openCookHistory()}
function ingredientWeightG(i){
 const n=num(i.amount);
 if(n===null)return null;
 const u=String(i.unit||'').trim().toLowerCase();
 if(/^(g|克|公克|gram|grams)$/.test(u))return n;
 if(/^(kg|千克|公斤|kilogram|kilograms)$/.test(u))return n*1000;
 if(u==='个' && /鸡蛋/.test(i.name))return n*55;
 return null;
}
function recipeTotalWeight(r){
 let total=0,count=0;
 for(const i of r.ingredients||[]){const w=ingredientWeightG(i);if(w!==null){total+=w;count++;}}
 return {total,count,all:(r.ingredients||[]).length};
}
function openTotalWeightModal(){
 const r=recipes.find(x=>x.name===selected);
 if(!r)return;
 const info=recipeTotalWeight(r);
 if(!(info.total>0)){toast('这个菜谱没有可计算的总重量');return}
 const excluded=info.all-info.count;
 showModal(`<h2>⚖️ 按菜谱总重调整</h2><p class="hint">当前可计算总重：<strong>${fmt(info.total)}g</strong>${excluded?`（${excluded} 项因单位为毫升、个等无法可靠换算为重量，未计入）`:''}</p><div class="scale-box"><label>目标总重量（g）</label><input id="totalTarget" type="number" min="0" step="any" placeholder="例如 2000"><div id="totalRatio" class="scale-result">—</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="applyTotal">应用调整</button></div>`);
 const update=()=>{const t=Number(document.getElementById('totalTarget').value);document.getElementById('totalRatio').textContent=t>0?`调整比例：${fmt(t/info.total)}×`:'—'};
 document.getElementById('totalTarget').oninput=update;
 document.getElementById('applyTotal').onclick=()=>{const t=Number(document.getElementById('totalTarget').value);if(!(t>0)){toast('请输入有效目标总重量');return}scale=t/info.total;closeModal();render()};
}
function openScaleModal(){
 const r=recipes.find(x=>x.name===selected); const opts=r.ingredients.map((i,idx)=>{let n=num(i.amount);return n!==null?`<option value="${idx}">${esc(i.name)}（${esc(i.amount)}${esc(i.unit)}${/鸡蛋/.test(i.name)}&&i.unit==='个'?'，约'+fmt(n*55)+'g':''}）</option>`:''}).join('');
 if(!opts){toast('这个菜谱没有可计算的数字配料');return}
 showModal(`<h2>⚖️ 按主材料调整配方</h2><p class="hint">可以任选一个有明确数字数量的配料作为基准。原始配方不会被修改。</p><div class="scale-grid"><div class="scale-box"><label>基准食材</label><select id="baseIng">${opts}</select></div><div class="scale-box"><label id="targetLabel">目标数量</label><input id="targetAmt" type="number" step="any" placeholder="输入目标数量"><div id="ratio" class="scale-result">—</div></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" id="applyBase">应用调整</button></div>`);
 const update=()=>{let i=r.ingredients[Number(document.getElementById('baseIng').value)],t=Number(document.getElementById('targetAmt').value);let base=num(i.amount);let egg=/鸡蛋/.test(i.name)&&i.unit==='个';document.getElementById('targetLabel').textContent=egg?'目标重量（g，鸡蛋按55g/个）':'目标数量（'+(i.unit||'')+'）';document.getElementById('targetAmt').placeholder=egg?'例如110':'输入目标数量';document.getElementById('ratio').textContent=(t>0?`调整比例：${fmt(t/(egg?base*55:base))}×`:'—')};document.getElementById('baseIng').onchange=update;document.getElementById('targetAmt').oninput=update;
 document.getElementById('applyBase').onclick=()=>{let i=r.ingredients[Number(document.getElementById('baseIng').value)],t=Number(document.getElementById('targetAmt').value);if(!(t>0)){toast('请输入有效目标数量');return}scale=t/((/鸡蛋/.test(i.name)&&i.unit==='个')?Number(i.amount)*55:Number(i.amount));closeModal();render()};
}

function parseRecipeText(text){
  // 统一手机复制/粘贴产生的换行，再进行结构化识别
  text=String(text||'').replace(/\u2029|\u2028/g,'\n').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ');
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
  const name=lines[0]||'新菜谱';
  let category='其他/实验', type='菜谱';
  if(/配方|酱料|腌制|蘸料/.test(name)) type='配方';
  if(/实验|研究|方案/.test(name)) type='实验';
  if(/蛋糕|烘焙|蛋挞/.test(name)) category='烘焙';
  else if(/鱼|虾|蟹|海鲜|三文鱼|螺/.test(name)) category='海鲜';
  else if(/鸡|牛|猪|羊|肉|排|翅|肚|肥肠/.test(name)) category='肉类';
  else if(/饭|面|饺子|米饭|粥/.test(name)) category='主食';
  else if(/汤|火锅/.test(name)) category='汤/火锅';
  else if(/酱|蘸料|醋|蚝油/.test(name)) category='酱料';
  else if(/咖啡|饮料|莫吉托/.test(name)) category='饮料';

  const ingredients=[], prep=[], cook=[], notes=[];
  let section='auto';
  const headers={
    '配料':'ingredients','材料':'ingredients','食材':'ingredients','原料':'ingredients','用料':'ingredients',
    '备菜':'prep','准备':'prep','准备工作':'prep','备料':'prep',
    '腌料':'ingredients','腌制':'prep',
    '做法':'cook','步骤':'cook','烹饪':'cook','烹制':'cook','制作':'cook','烹调':'cook',
    '烹饪步骤':'cook','烹饪过程':'cook','制作步骤':'cook','制作过程':'cook','烹调步骤':'cook',
    '备注':'notes','说明':'notes','注意':'notes','注意事项':'notes'
  };
  const cleanHeader=s=>String(s||'').replace(/[\s：:（）()【】\[\]、.。_\-—]+/g,'');
  const getHeader=s=>{const n=cleanHeader(s); return headers[n]||null;};
  const add=(n,a,u,note='')=>{n=String(n||'').trim(); if(!n)return false; ingredients.push([n,String(a||'').trim(),String(u||'').trim(),String(note||'').trim()]); return true;};

  // 数量支持：1000g鸡肉 / 鸡肉1000g / 50-100g水 / 1.5kg牛肉
  const units='kg|mg|ml|g|l|L|个|只|份|勺|汤匙|茶匙|tbsp|tsp|%';
  const num='[0-9]+(?:\\.[0-9]+)?(?:\\s*-\\s*[0-9]+(?:\\.[0-9]+)?)?';
  const pre=new RegExp('^('+num+')\\s*('+units+')\\s*(.+?)$','i');
  const suf=new RegExp('^(.+?)\\s*('+num+')\\s*('+units+')(?:\\s*[：:]?\\s*(.*))?$','i');
  const specialSuffix=new RegExp('^(.+?)\\s*(适量|少量|一点点|两点点|若干)$');
  const specialColon=/^(.+?)[：:]\s*(适量|少量|一点点|两点点|若干)$/;

  function parseOne(line){
    line=String(line||'').trim(); if(!line)return false;
    // 同一行多个配料，例如：鸡翅310g，生抽18g，老抽6g
    const parts=line.split(/[，,；;、]+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length>1){let ok=0; for(const p of parts) if(parseOne(p)) ok++; return ok>0;}
    let m=line.match(pre);
    if(m){add(m[3],m[1].replace(/\s+/g,''),m[2]);return true;}
    m=line.match(suf);
    if(m){add(m[1],m[2].replace(/\s+/g,''),m[3],m[4]||'');return true;}
    m=line.match(specialColon);
    if(m){add(m[1],m[2], '');return true;}
    m=line.match(specialSuffix);
    if(m){add(m[1],m[2], '');return true;}
    return false;
  }

  // 自动模式：连续识别到配料就归入配料；第一次识别失败后，后续普通句子归入烹饪。
  let autoSawIngredient=false, autoStartedCook=false;
  for(let i=1;i<lines.length;i++){
    const raw=lines[i];
    const noTrail=raw.replace(/[：:]\s*$/,'').trim();
    const explicit=getHeader(noTrail);
    if(explicit){section=explicit;continue;}

    const colon=raw.match(/^(.+?)[：:]\s*(.+)$/);
    if(colon){
      const h=getHeader(colon[1]);
      if(h){
        section=h;
        const rest=colon[2].trim();
        if(rest){
          if(section==='ingredients')parseOne(rest);
          else if(section==='prep')prep.push(rest);
          else if(section==='cook')cook.push(rest);
          else notes.push(rest);
        }
        continue;
      }
    }

    if(section==='auto'){
      if(parseOne(raw)){autoSawIngredient=true; continue;}
      if(autoSawIngredient || autoStartedCook){autoStartedCook=true; cook.push(raw);}
      else notes.push(raw);
    }else if(section==='ingredients'){
      if(!parseOne(raw)) notes.push(raw);
    }else if(section==='prep'){
      prep.push(raw);
    }else if(section==='cook'){
      cook.push(raw);
    }else{
      notes.push(raw);
    }
  }
  return {name,category,type,ingredients,prep,cook,notes:notes.join('\n')};
}

 document.getElementById('addIng').onclick=()=>document.getElementById('ings').insertAdjacentHTML('beforeend',ingRow(['','','',''],Date.now()));

function openEditor(name){

 showModal(`<h2>${name?'✏️ 编辑菜谱':'＋ 新增菜谱'}</h2>
 <div class="form-row"><input id="rName" placeholder="菜谱名称" value="${esc(r.name)}"><select id="rCat">${['主食','肉类','海鲜','蔬菜','汤/火锅','烘焙','饮料','酱料','其他/实验'].map(x=>`<option ${x===r.category?'selected':''}>${x}</option>`).join('')}</select><select id="rType">${['菜谱','配方','实验'].map(x=>`<option ${x===r.type?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="editor-section"><h3>🧂 配料</h3><div id="ings">${ingRows}</div><button class="mini" id="addIng">＋ 添加配料</button></div>

 <div class="editor-section steps-editor"><h3>🍳 烹饪</h3><div id="cook">${cookRows}</div><button class="mini" id="addCook">＋ 添加步骤</button></div>
 <div class="editor-section"><h3>📝 备注</h3><textarea id="rNotes" rows="4" placeholder="备注、原始记录说明等">${esc(r.notes)}</textarea></div>

 document.getElementById('addIng').onclick=()=>{document.getElementById('ings').insertAdjacentHTML('beforeend',ingRow(['','','',''],Date.now()))};
 document.getElementById('addPrep').onclick=()=>{let c=document.getElementById('prep');c.insertAdjacentHTML('beforeend',stepRow('prep','',Date.now()))};
 document.getElementById('addCook').onclick=()=>{let c=document.getElementById('cook');c.insertAdjacentHTML('beforeend',stepRow('cook','',Date.now()))};

function ingRow(i,idx){const a=Array.isArray(i)?i:[i.name||'',i.amount||'',i.unit||'',i.note||''];return `<div class="ing-row" data-ing="${idx}" data-ing-id="${esc((i&&i.id)||'')}"><input placeholder="食材" value="${esc(a[0])}"><input placeholder="数量" value="${esc(a[1])}"><input placeholder="单位" value="${esc(a[2])}"><input placeholder="备注" value="${esc(a[3])}"><button class="mini danger" onclick="this.parentElement.remove()">×</button></div>`}
function stepRow(kind,s,idx){return `<div class="step-edit" data-step="${kind}"><div class="move"><button class="mini" onclick="moveStep(this,-1)">↑</button><button class="mini" onclick="moveStep(this,1)">↓</button></div><textarea placeholder="输入步骤">${esc(s)}</textarea><button class="mini danger" onclick="this.parentElement.remove()">×</button></div>`}
function moveStep(btn,d){let el=btn.closest('.step-edit'),sib=d<0?el.previousElementSibling:el.nextElementSibling;if(sib) d<0?sib.before(el):sib.after(el)}
function saveEditor(oldName){
 const name=document.getElementById('rName').value.trim();if(!name){toast('请输入菜谱名称');return}
 const ingredients=[...document.querySelectorAll('#ings .ing-row')].map(x=>{const v=[...x.querySelectorAll('input')].map(i=>i.value.trim());return {id:x.dataset.ingId||uid('ing'),name:v[0],amount:v[1],unit:v[2],note:v[3]}}).filter(i=>i.name);
 const getSteps=id=>[...document.querySelectorAll(id+' .step-edit textarea')].map(x=>x.value.trim()).filter(Boolean);
 const old=oldName?recipes.find(x=>x.name===oldName):null; const r={id:old?.id||uid('recipe'),name,category:document.getElementById('rCat').value,type:document.getElementById('rType').value,ingredients,prep:getSteps('#prep'),cook:getSteps('#cook'),notes:document.getElementById('rNotes').value.trim()};
 if(oldName){
   let idx=recipes.findIndex(x=>x.name===oldName);
   if(idx>=0){
     let duplicate=recipes.findIndex((x,j)=>j!==idx && x.name===name);
     if(duplicate>=0){toast('已有同名菜谱，请修改菜名');return}
     recipes[idx]=r;
   }
 }else{
   if(recipes.some(x=>x.name===name)){toast('已有同名菜谱，请修改菜名');return}
   recipes.push(r);
 }
 selected=name;scale=1;save();closeModal();render();toast('已保存');
}
function deleteRecipe(name){
 const r=recipes.find(x=>x.name===name);
 if(!r){toast('未找到要删除的菜谱');return}
 showModal(`<h2>🗑️ 删除菜谱</h2>
 <p>确定要删除「<strong>${esc(name)}</strong>」吗？</p>
 <p class="hint">删除后不会影响其他菜谱；如果之前导出过 JSON 备份，可以从备份恢复。</p>
 <div class="modal-actions"><button class="secondary" id="cancelDelete">取消</button><button class="primary danger" id="confirmDelete">确认删除</button></div>`);
 document.getElementById('cancelDelete').onclick=closeModal;
 document.getElementById('confirmDelete').onclick=async()=>{
   const target=recipes.find(x=>x.name===name);
   recipes=recipes.filter(x=>x.id!==target?.id);
   const records=loadCookRecords();
   const doomed=records.filter(x=>x.recipeId===target?.id || (!x.recipeId&&x.recipe===name));
   for(const rec of doomed){for(const pid of rec.photos||[]){try{await delCookPhoto(pid)}catch{}}}
   saveCookRecords(records.filter(x=>!(x.recipeId===target?.id || (!x.recipeId&&x.recipe===name))));
   for(const key of Object.keys(ingredientChecks)){if(key.startsWith((target?.id||'')+'::'))delete ingredientChecks[key]}
   localStorage.setItem('recipeIngredientChecks',JSON.stringify(ingredientChecks));
   selected=recipes[0]?.name||null; scale=1; save(); closeModal(); render(); toast('已删除');
 };
}
async function blobToDataURL(blob){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)})}
function dataURLToBlob(data){const [head,b64]=String(data).split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'image/jpeg';const bin=atob(b64||'');const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
async function makeFullBackup(){const records=loadCookRecords();const photos={};for(const rec of records){for(const pid of rec.photos||[]){const blob=await getCookPhoto(pid);if(blob)photos[pid]=await blobToDataURL(blob)}}return {version:2,exportedAt:new Date().toISOString(),recipes,ingredientChecks,records,photos}}
function backupModal(){
 const isFilePage=location.protocol==='file:'; const canSaveAs=typeof window.showSaveFilePicker==='function'&&window.isSecureContext;
 showModal(`<h2>💾 数据备份</h2><p>当前共有 <strong>${recipes.length}</strong> 个菜谱。</p><div style="background:#f5f6f8;border-radius:9px;padding:12px 13px;margin:12px 0;line-height:1.6;font-size:13px"><strong>完整备份包含：</strong>菜谱、配料Checklist、跟做历史、照片。照片会转成压缩后的数据写入备份，因此文件可能比较大。</div><div class="modal-actions" style="flex-wrap:wrap"><button class="primary" id="export">⬇️ 导出完整备份</button><button class="secondary" id="copyBackup">📋 复制完整备份</button><button class="secondary" id="importBtn">📥 导入备份</button><button class="secondary" onclick="closeModal()">关闭</button></div><div class="hint" style="margin-top:12px">${isFilePage?'直接双击 HTML 时不能使用系统“另存为”，请使用“导出完整备份”。':(canSaveAs?'当前环境支持系统保存。':'当前环境不支持系统保存。')}</div><input type="file" id="fileInput" accept=".json,application/json" style="display:none"><textarea id="backupText" style="position:fixed;left:-99999px;top:-99999px;width:1px;height:1px"></textarea>`);
 const exportBtn=document.getElementById('export'); exportBtn.onclick=async()=>{exportBtn.disabled=true;exportBtn.textContent='⏳ 正在整理照片…';try{const data=await makeFullBackup();const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='我的食谱完整备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('完整备份已导出')}catch(e){toast('备份失败')}finally{exportBtn.disabled=false;exportBtn.textContent='⬇️ 导出完整备份'}};
 document.getElementById('copyBackup').onclick=async()=>{try{const data=await makeFullBackup();await navigator.clipboard.writeText(JSON.stringify(data));toast('完整备份已复制')}catch(e){toast('复制失败，请改用导出文件')}};
 document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
 document.getElementById('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());const incoming=Array.isArray(x)?{version:1,recipes:x,ingredientChecks:{},records:[],photos:{}}:x;if(!Array.isArray(incoming.recipes))throw new Error('invalid');if(!confirm(`准备导入 ${incoming.recipes.length} 个菜谱${Array.isArray(incoming.records)?`和 ${incoming.records.length} 条跟做记录`:''}，会替换当前数据，是否继续？`))return;recipes=incoming.recipes.map(normalizeRecipe);ingredientChecks=incoming.ingredientChecks||{};saveCookRecords(Array.isArray(incoming.records)?incoming.records:[]);for(const [pid,data] of Object.entries(incoming.photos||{})){try{await putCookPhoto(pid,dataURLToBlob(data))}catch{}}migrateChecklist();migrateCookRecords();save();selected=recipes[0]?.name||null;category='全部';query='';scale=1;closeModal();render();toast('完整备份导入成功')}catch(e){toast('备份文件格式不正确，未导入')}};
}

function closeModal(){document.getElementById('modal')?.remove()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
